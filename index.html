<!DOCTYPE html>
<html lang="en">

<link rel="preconnect" href="https://fonts.googleapis.com">

<body>

<!-- Shared SVG definitions -->
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <defs>
    <linearGradient id="gGold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FCEBB0"/>
      <stop offset="0.35" stop-color="#E3B54C"/>
      <stop offset="0.7" stop-color="#A8761C"/>
      <stop offset="1" stop-color="#E3B54C"/>

    <g id="fret" fill="none" stroke="url(#gGold)" stroke-linecap="square">
      <path d="M7.5,100 V7.5 H100" stroke-width="3"/>
      <path d="M14.5,100 V14.5 H100" stroke-width="1"/>
      <path d="M22,62 V22 H62 V50 H34 V34 H50 V42 H42" stroke-width="2.6"/>

<div class="clouds" aria-hidden="true"></div>
<div class="doom" aria-hidden="true"></div>

<div class="frame" aria-hidden="true">

    <button class="call-btn end" type="button" hidden><i><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6.6 10.8c1.4 2.8 3.8 5.1 6.6 6.6l2.2-2.2c.3-.3.7-.4 1-.2 1.1.4 2.3.6 3.6.6.6 0 1 .4 1 1V20c0 .6-.4 1-1 1C10.6 21 3 13.4 3 4c0-.6.4-1 1-1h3.5c.6 0 1 .4 1 1 0 1.3.2 2.5.6 3.6.1.3 0 .7-.2 1z"/></svg></i>End</button>
    <button class="call-btn accept" type="button"><i><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6.6 10.8c1.4 2.8 3.8 5.1 6.6 6.6l2.2-2.2c.3-.3.7-.4 1-.2 1.1.4 2.3.6 3.6.6.6 0 1 .4 1 1V20c0 .6-.4 1-1 1C10.6 21 3 13.4 3 4c0-.6.4-1 1-1h3.5c.6 0 1 .4 1 1 0 1.3.2 2.5.6 3.6.1.3 0 .7-.2 1z"/></svg></i>Accept</button>

<div class="page">

  <main>

        <g fill="none" stroke="#9C8566" stroke-opacity="0.45" stroke-width="1" stroke-linejoin="round">
          <path d="M27,17 L34,36 L18,40 M46,9 L50,30 L65,13 M81,27 L70,40 L87,47 M78,67 L66,56 L60,79 M37,81 L38,62 L19,68 M11,52 L30,50 M50,30 L34,36 L30,50 L38,62 L52,64 L66,56 L70,40 L56,30 Z"/>
        </g>

          <path d="M40,44 l9,-2 M42,49 l12,-3 M45,55 l7,-1"/>
          <path d="M60,46 l5,1" stroke-opacity="0.35"/>

        <polygon points="18,40 27,17 46,9 65,13 81,27 87,47 78,67 60,79 37,81 19,68 11,52" fill="none" stroke="#A89474" stroke-opacity="0.5" stroke-width="1.2" stroke-linejoin="round"/>

  <div class="controls">

    <button class="music" type="button" aria-pressed="true">&#9835; <span>Sound on</span></button>

<script>
/* ===== Fortunes =====
   For the Vercel build, move this object into fortunes.json and fetch it.
   "real" is a PLACEHOLDER until the spreadsheet of collected fortunes is added. */
const FORTUNES = {
  real: [
    "A pleasant surprise is waiting for you.",
    "Your patience will be rewarded sooner than you think.",
    "An old friend will bring you good news.",
    "Now is the time to try something new.",
    "Your kindness will open an unexpected door.",
    "Good things come to those who stay curious.",
    "A small step today becomes a long road tomorrow.",
    "You will find what you lost in an unlikely place."
  ],
  // Rage mode: shown when someone taps 6 times in a hurry
  rage: [
    "Tapping harder does not make the cookie work faster.",
    "Patience is a virtue. You have neither.",
    "Calm down. The cookie is doing its best.",
    "Six taps in two seconds. Seek help.",
    "The cookie has filed a complaint about your behavior.",
    "Your impatience has been noted and forwarded to your mother.",
    "Stop poking me.",
    "Congratulations, you have unlocked: nothing."
  ],
  // Chopsticks rounds draw from this extra-crude list
  sticks: [
    "Sorry, we're out of cookies. Also, your fly is open.",
    "These chopsticks split up easier than your last relationship.",
    "Someone near you just farted. It was you.",
    "That rash is not going away on its own.",
    "You smell like regret and onion rings.",
    "Your parents had a favorite. It wasn't you.",
    "Nobody liked your haircut. They were being polite.",
    "Don't sneeze in the next hour. Trust me on this.",
    "Your browser history has been printed and mailed to your mother.",
    "You will step in something warm today. Barefoot.",
    "The group chat is still active. You're just not in it anymore.",
    "Your plants are dying on purpose.",
    "Wash your hands. We both know why."
  ],
  crude: [
    "I hope you can swim.",
    "Excellent time to become a missing person.",
    "Don't feed the bats tonight.",
    "Future looks spotty. You will spill soup in late evening.",
    "You have the capacity to learn from mistakes. You'll learn a lot today.",
    "Don't plan any hasty moves. You'll be evicted soon anyway.",
    "You are not illiterate!",
    "A foolish man listens to his heart. A wise man listens to cookies.",
    "About time I got out of that cookie.",
    "The fortune you seek is in another cookie.",
    "A lucrative career change awaits. Have you considered gangsta rap?",
    "Some fortune cookies contain no fortune.",
    "These numbers below mean absolutely nothing.",
    "It's a long ride home. It is wise to use the bathroom.",
    "You will be successful someday...",
    "The one thing you can always count on in life is a calculator.",
    "The call is coming from inside the house.",
    "You are not lost. You are simply somewhere you did not intend to be.",
    "The voices in your head have excellent points. Consider taking minutes.",
    "Never trust a man with two first names.",
    "Never trust a woman into taxidermy.",
    "Your aura is the color of a gas station bathroom.",
    "A stranger will change your life. Check your trunk.",
    "Your enemies are plotting. They are bad at it, but enthusiastic.",
    "He who smiles next knows what you did.",
    "Your ancestors are disappointed, but they also did some weird shit.",
    "Today is a good day to steal a traffic cone.",
    "The moon is full. The squirrels are organizing.",
    "Your best years are behind you.",
    "Try again tomorrow. Today has been a disaster.",
    "Lower your expectations. Then lower them again.",
    "Mercury is in retrograde. So is your credit score.",
    "Everything happens for a reason. Sometimes it's because you're an idiot.",
    "The next chapter of your life is sponsored by poor impulse control.",
    "Your kindness will be mistaken for weakness. Weaponize the confusion.",
    "Good news: It gets worse.",
    "You will soon disappoint someone new.",
    "The Council demands a sacrifice.",
    "Your ancestors did not survive the plague for this.",
    "Beware of people who say \"let's circle back.\"",
    "You will soon receive an unexpected package. Don't ask what's inside.",
    "Your soulmate is nearby. Unfortunately, so is their probation officer."
  ]
};

(() => {
  const $ = (s) => document.querySelector(s);
  const stage = $(".stage");
  const cookie = $(".cookie");
  const halfL = $(".half.left");
  const halfR = $(".half.right");
  const sticks = $(".sticks");
  const stickU = $(".stick.upper");
  const stickL = $(".stick.lower");
  let kind = "cookie";   // or "sticks"
  // "missing person" sets up the next cookie as the phone call
  const CALL = "The call is coming from inside the house.";
  let forceCall = false, empty = false;
  function pickKind() {
    if (forceCall) { kind = "cookie"; empty = false; }
    else {
      kind = Math.random() < 0.1 ? "sticks" : "cookie";
      empty = kind === "cookie" && Math.random() < 1 / 25;   // 1 in 25 cookies has no fortune
    }
    showKind();
  }
  function showKind() {
    cookie.hidden = kind !== "cookie";
    sticks.hidden = kind !== "sticks";
    hint.textContent = kind === "sticks" ? "Tap the chopsticks" : "Tap the cookie";
    stage.setAttribute("aria-label", kind === "sticks" ? "Split the chopsticks" : "Open the fortune cookie");
  }
  const slip = $(".slip");
  const flash = $(".flash");
  const fortuneEl = $(".fortune-text");
  const luckyEl = $(".lucky");
  const hint = $(".hint");
  const reduced = matchMedia("(prefers-reduced-motion: reduce)").matches;

  const store = {
    get(k) { try { return localStorage.getItem(k); } catch { return null; } },
    set(k, v) { try { localStorage.setItem(k, v); } catch {} }
  };

  /* ----- settings ----- */
  let mode = store.get("fc-mode") === "real" ? "real" : "crude";
  document.getElementById("mode-" + mode).checked = true;
  document.querySelectorAll('input[name="mode"]').forEach((r) => r.addEventListener("change", () => {
    mode = r.value; store.set("fc-mode", mode);
    if (state === "closed") loadFortune();
  }));

  /* ----- fortunes: shuffle bags so nothing repeats until the list runs out ----- */
  const bags = { real: [], crude: [], sticks: [], rage: [] };
  function draw(list) {
    if (!bags[list].length) {
      bags[list] = FORTUNES[list].filter((f) => f !== CALL);   // the call only comes as a follow-up
      for (let i = bags[list].length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [bags[list][i], bags[list][j]] = [bags[list][j], bags[list][i]];
      }
    }
    return bags[list].pop();
  }
  function luckyNumbers(count = 6, max = 99) {
    const pool = Array.from({ length: max }, (_, i) => i + 1);
    const out = [];
    for (let i = 0; i < count; i++) out.push(pool.splice(Math.floor(Math.random() * pool.length), 1)[0]);
    return out;
  }
  function loadFortune() {
    luckyEl.querySelectorAll("span").forEach((s) => s.remove());
    stage.classList.remove("retro");
    if (empty) { fortuneEl.textContent = ""; return; }
    fortuneEl.textContent = forceCall ? CALL : draw(kind === "sticks" ? "sticks" : mode);
    // Mercury in retrograde: the cookie shows up upside down
    if (/Mercury is in retrograde/.test(fortuneEl.textContent)) stage.classList.add("retro");
    const t = fortuneEl.textContent;
    const nums = /Council demands a sacrifice/.test(t) ? Array(6).fill(6)
      : /contain no fortune/.test(t) ? Array(6).fill("?")
      : luckyNumbers();
    nums.forEach((n, i, all) => {
      const s = document.createElement("span");
      s.textContent = n + (i < all.length - 1 ? "," : "");
      luckyEl.append(s);
    });
  }

  /* ----- particles ----- */
  const cvs = $("canvas.fx");
  const ctx = cvs.getContext("2d");
  let W = 0, H = 0, dpr = 1, parts = [], running = false;
  function resize() {
    dpr = Math.min(window.devicePixelRatio || 1, 2);
    W = innerWidth; H = innerHeight;
    cvs.width = W * dpr; cvs.height = H * dpr;
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  }
  resize(); addEventListener("resize", resize);
  const rand = (a, b) => a + Math.random() * (b - a);
  const pick = (a) => a[Math.floor(Math.random() * a.length)];

  function burst(x, y, crumbs = true, sparks = true, n = 30) {
    const crumbCols = ["#F2C27A", "#E9A44F", "#D88A35", "#B9722A", "#F7D9A4"];
    for (let i = 0; i < (crumbs ? n : 0); i++) {
      const pts = Array.from({ length: 6 }, () => rand(0.55, 1));
      parts.push({ k: "crumb", x: x + rand(-24, 24), y: y + rand(-8, 18), vx: rand(-2.8, 2.8), vy: rand(-4.5, 0.5),
        r: rand(1.8, 4.6), rot: rand(0, 6.28), vr: rand(-0.25, 0.25), c: pick(crumbCols), pts, born: performance.now() });
    }
    for (let i = 0; i < (sparks ? 26 : 0); i++) {
      const a = rand(0, Math.PI * 2), s = rand(3, 9);
      parts.push({ k: "spark", x, y: y - 6, vx: Math.cos(a) * s, vy: Math.sin(a) * s - 1.5,
        r: rand(3, 7.5), life: rand(700, 1200), ph: rand(0, 6.28), born: performance.now() });
    }
    if (!running) { running = true; requestAnimationFrame(tick); }
  }
  function star(r) {
    ctx.beginPath();
    for (let i = 0; i < 8; i++) {
      const rr = i % 2 ? r * 0.28 : r, a = (i * Math.PI) / 4;
      ctx.lineTo(Math.cos(a) * rr, Math.sin(a) * rr);
    }
    ctx.closePath();
  }
  function tick(now) {
    ctx.clearRect(0, 0, W, H);
    parts = parts.filter((p) => {
      const age = now - p.born;
      if (p.k === "crumb") {
        p.vy += 0.34; p.vx *= 0.99; p.x += p.vx; p.y += p.vy; p.rot += p.vr;
        if (p.y > H + 20) return false;
        ctx.save(); ctx.translate(p.x, p.y); ctx.rotate(p.rot);
        ctx.beginPath();
        p.pts.forEach((m, i) => { const a = (i / p.pts.length) * Math.PI * 2; ctx.lineTo(Math.cos(a) * p.r * m, Math.sin(a) * p.r * m); });
        ctx.closePath(); ctx.fillStyle = p.c; ctx.fill();
        ctx.restore();
        return true;
      }
      const t = age / p.life;
      if (t >= 1) return false;
      p.vx *= 0.9; p.vy = p.vy * 0.9 + 0.06; p.x += p.vx; p.y += p.vy;
      const tw = 0.65 + 0.35 * Math.sin(p.ph + age / 55);
      ctx.save(); ctx.translate(p.x, p.y); ctx.rotate(age / 400);
      ctx.globalAlpha = (1 - t) * tw;
      ctx.shadowColor = "rgba(255, 214, 110, 0.9)"; ctx.shadowBlur = 10;
      star(p.r * (1 - t * 0.4)); ctx.fillStyle = "#FDE9A6"; ctx.fill();
      ctx.restore();
      return true;
    });
    if (parts.length) requestAnimationFrame(tick); else { running = false; ctx.clearRect(0, 0, W, H); }
  }


  /* ----- background music: a plucked zither-style tune on a pentatonic scale, made in the browser ----- */
  const Music = (() => {
    let ac = null, master = null, bus = null, fx = null, noise = null, timer = null, nextTime = 0, step = 0, playing = false;
    const BEAT = 60 / 76;                                   // tempo
    const hz = (m) => 440 * Math.pow(2, (m - 69) / 12);
    // D pentatonic phrases: [midi note, beats]
    const PHRASES = [
      [[74,.5],[76,.5],[78,1],[76,.5],[74,.5],[71,1],[69,1],[71,.5],[74,.5],[69,2]],
      [[66,.5],[69,.5],[71,1],[74,1],[71,.5],[69,.5],[66,1],[64,1],[62,2]],
      [[81,1],[78,.5],[76,.5],[74,1],[76,.5],[78,.5],[81,1.5],[78,.5],[76,2]],
      [[74,.5],[71,.5],[69,1],[66,.5],[69,.5],[71,1],[69,.5],[66,.5],[64,1],[62,2]]
    ];
    const BASS = [[50,45],[47,50],[45,47],[45,50]];        // two bass notes per phrase
    const melody = [];
    PHRASES.forEach((ph, i) => {
      let t = 0;
      ph.forEach(([n, d]) => { melody.push({ n, d, at: i * 8 + t }); t += d; });
      melody.push({ bass: BASS[i][0], at: i * 8 }, { bass: BASS[i][1], at: i * 8 + 4 });
    });
    melody.sort((a, b) => a.at - b.at);
    const LOOP = 32;

    function reverb() {
      const len = ac.sampleRate * 2.4, buf = ac.createBuffer(2, len, ac.sampleRate);
      for (let c = 0; c < 2; c++) {
        const d = buf.getChannelData(c);
        for (let i = 0; i < len; i++) d[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / len, 3);
      }
      const cv = ac.createConvolver(); cv.buffer = buf; return cv;
    }
    function pluck(midi, t, dur, vol = 0.22) {
      const f = hz(midi), long = dur >= 1;
      const g = ac.createGain();
      g.gain.setValueAtTime(0.0001, t);
      g.gain.exponentialRampToValueAtTime(vol, t + 0.008);
      g.gain.exponentialRampToValueAtTime(0.0001, t + Math.max(0.9, dur * BEAT * 1.6));
      const lp = ac.createBiquadFilter(); lp.type = "lowpass";
      lp.frequency.setValueAtTime(f * 7, t); lp.frequency.exponentialRampToValueAtTime(f * 2, t + 0.5);
      [[1, "triangle", 1], [2, "sine", 0.35], [3, "sine", 0.12]].forEach(([mult, type, amt]) => {
        const o = ac.createOscillator(), og = ac.createGain();
        o.type = type; og.gain.value = amt;
        // long notes slide up into pitch and wobble, like a bent zither string
        if (long) { o.frequency.setValueAtTime(f * mult * 0.94, t); o.frequency.exponentialRampToValueAtTime(f * mult, t + 0.09); }
        else o.frequency.setValueAtTime(f * mult, t);
        if (long) {
          const lfo = ac.createOscillator(), lg = ac.createGain();
          lfo.frequency.value = 5.5; lg.gain.setValueAtTime(0, t); lg.gain.linearRampToValueAtTime(f * mult * 0.012, t + 0.4);
          lfo.connect(lg).connect(o.frequency); lfo.start(t); lfo.stop(t + dur * BEAT + 1.5);
        }
        o.connect(og).connect(lp); o.start(t); o.stop(t + dur * BEAT + 1.6);
      });
      lp.connect(g).connect(master);
    }
    function bass(midi, t) {
      const o = ac.createOscillator(), g = ac.createGain();
      o.type = "sine"; o.frequency.value = hz(midi);
      g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(0.16, t + 0.05);
      g.gain.exponentialRampToValueAtTime(0.0001, t + BEAT * 3.8);
      o.connect(g).connect(master); o.start(t); o.stop(t + BEAT * 4);
    }
    function schedule() {
      while (nextTime < ac.currentTime + 0.6) {
        const ev = melody[step % melody.length];
        const t = nextTime;
        if (ev.bass) bass(ev.bass, t); else pluck(ev.n, t, ev.d);
        step++;
        const nxt = melody[step % melody.length];
        const nAt = nxt.at + (step % melody.length === 0 ? LOOP : 0);
        nextTime += (nAt - ev.at) * BEAT;
      }
    }
    // shared audio graph: music + effects -> bus -> dry + reverb
    function ensure() {
      try {
        if (!ac) {
          ac = new (window.AudioContext || window.webkitAudioContext)();
          bus = ac.createGain();
          master = ac.createGain(); master.gain.value = 0; master.connect(bus);
          fx = ac.createGain(); fx.gain.value = 0.9; fx.connect(bus);
          const dry = ac.createGain(), wet = ac.createGain(), rv = reverb();
          dry.gain.value = 0.8; wet.gain.value = 0.35;
          bus.connect(dry).connect(ac.destination);
          bus.connect(rv).connect(wet).connect(ac.destination);
          const len = ac.sampleRate * 0.5;
          noise = ac.createBuffer(1, len, ac.sampleRate);
          const d = noise.getChannelData(0);
          for (let i = 0; i < len; i++) d[i] = Math.random() * 2 - 1;
        }
        ac.resume();
        return true;
      } catch (e) { return false; }
    }

    /* ----- sound effects ----- */
    function noiseHit(t, { freq, q = 1, dur, vol, type = "bandpass" }) {
      const src = ac.createBufferSource(), f = ac.createBiquadFilter(), g = ac.createGain();
      src.buffer = noise; src.playbackRate.value = 0.8 + Math.random() * 0.4;
      f.type = type; f.frequency.value = freq; f.Q.value = q;
      g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
      src.connect(f).connect(g).connect(fx);
      src.start(t, Math.random() * 0.3); src.stop(t + dur + 0.02);
    }
    function tone(t, { f0, f1 = f0, dur, vol, type = "sine" }) {
      const o = ac.createOscillator(), g = ac.createGain();
      o.type = type; o.frequency.setValueAtTime(f0, t); o.frequency.exponentialRampToValueAtTime(f1, t + dur);
      g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(vol, t + 0.004);
      g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
      o.connect(g).connect(fx); o.start(t); o.stop(t + dur + 0.02);
    }
    // crunchy cookie snap: a low thump and a few crackles
    function crack() {
      const t = ac.currentTime + 0.01;
      tone(t, { f0: 140, f1: 55, dur: 0.12, vol: 0.5 });
      noiseHit(t, { freq: 2200, q: 0.9, dur: 0.07, vol: 0.9 });
      for (let i = 0; i < 5; i++) {
        noiseHit(t + 0.02 + Math.random() * 0.11, { freq: 1500 + Math.random() * 2800, q: 2, dur: 0.02 + Math.random() * 0.04, vol: 0.25 + Math.random() * 0.35 });
      }
    }
    // wooden chopsticks clacking apart
    function snap() {
      const t = ac.currentTime + 0.01;
      [0, 0.07].forEach((dt, i) => {
        noiseHit(t + dt, { freq: i ? 1100 : 1500, q: 7, dur: 0.05, vol: 0.9 });
        tone(t + dt, { f0: i ? 760 : 980, f1: i ? 700 : 900, dur: 0.06, vol: 0.28, type: "triangle" });
      });
    }
    // twinkly bell sparkles on a pentatonic scale
    function sparkle() {
      const t = ac.currentTime + 0.05;
      const notes = [86, 88, 90, 93, 95, 98, 100];
      for (let i = 0; i < 7; i++) {
        const at = t + i * 0.07 + Math.random() * 0.04, f = 440 * Math.pow(2, (notes[Math.floor(Math.random() * notes.length)] - 69) / 12);
        const v = 0.09 * (1 - i / 9);
        tone(at, { f0: f, dur: 0.7, vol: v });
        tone(at, { f0: f * 1.003, dur: 0.6, vol: v * 0.6 });
        tone(at, { f0: f * 2.76, dur: 0.18, vol: v * 0.25 });
      }
    }

    // The Council: a sub boom, a dissonant drone that swells and fades, music ducked underneath
    function doom() {
      const t = ac.currentTime + 0.02, len = 7;
      tone(t, { f0: 70, f1: 28, dur: 2.6, vol: 0.9 });
      noiseHit(t, { freq: 160, q: 0.7, dur: 2, vol: 1.2, type: "lowpass" });
      const lp = ac.createBiquadFilter(), g = ac.createGain();
      lp.type = "lowpass"; lp.frequency.setValueAtTime(180, t); lp.frequency.linearRampToValueAtTime(520, t + 3); lp.frequency.linearRampToValueAtTime(150, t + len);
      g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(0.32, t + 1.8);
      g.gain.setValueAtTime(0.32, t + len - 2.5); g.gain.exponentialRampToValueAtTime(0.0001, t + len);
      lp.connect(g).connect(fx);
      [55, 55.4, 77.8, 116.5, 38.9].forEach((f) => {           // A, beating A, tritone, more dissonance, sub
        const o = ac.createOscillator(); o.type = "sawtooth"; o.frequency.value = f;
        o.connect(lp); o.start(t); o.stop(t + len + 0.1);
      });
      if (playing) {
        master.gain.cancelScheduledValues(t);
        master.gain.setTargetAtTime(0.04, t, 0.3);
        master.gain.setTargetAtTime(0.55, t + len, 1.2);
      }
    }

    // classic double ring (two mixed tones, ring-ring ... pause)
    let ringTimer = null;
    function ringOnce() {
      const t = ac.currentTime + 0.02;
      [0, 0.6].forEach((dt) => {
        [400, 450].forEach((f) => {
          const o = ac.createOscillator(), g = ac.createGain();
          o.frequency.value = f;
          g.gain.setValueAtTime(0.0001, t + dt); g.gain.exponentialRampToValueAtTime(0.12, t + dt + 0.02);
          g.gain.setValueAtTime(0.12, t + dt + 0.4); g.gain.exponentialRampToValueAtTime(0.0001, t + dt + 0.45);
          o.connect(g).connect(fx); o.start(t + dt); o.stop(t + dt + 0.5);
        });
      });
    }
    function ring(on) {
      clearInterval(ringTimer); ringTimer = null;
      if (!on) return;
      ringOnce(); ringTimer = setInterval(ringOnce, 3000);
    }
    // slow, wet breathing: filtered noise swelling in and out
    function breathe() {
      const t = ac.currentTime + 0.05;
      for (let i = 0; i < 4; i++) {
        const at = t + i * 1.7, inhale = i % 2 === 0;
        const src = ac.createBufferSource(), f = ac.createBiquadFilter(), g = ac.createGain();
        src.buffer = noise; src.loop = true;
        f.type = "bandpass"; f.Q.value = 1.2;
        f.frequency.setValueAtTime(inhale ? 700 : 1100, at); f.frequency.linearRampToValueAtTime(inhale ? 1200 : 600, at + 1.3);
        g.gain.setValueAtTime(0.0001, at); g.gain.exponentialRampToValueAtTime(inhale ? 0.35 : 0.5, at + 0.6);
        g.gain.exponentialRampToValueAtTime(0.0001, at + 1.5);
        src.connect(f).connect(g).connect(fx); src.start(at); src.stop(at + 1.6);
      }
    }
    function duck(on) {
      if (!playing) return;
      master.gain.cancelScheduledValues(ac.currentTime);
      master.gain.setTargetAtTime(on ? 0.05 : 0.55, ac.currentTime, on ? 0.2 : 1);
    }
    // angry buzzer for rage mode
    function buzz() {
      const t = ac.currentTime + 0.01;
      [92, 97].forEach((f) => tone(t, { f0: f, f1: f * 0.9, dur: 0.45, vol: 0.22, type: "square" }));
    }

    // sad trombone-ish "womp womp" for an empty cookie
    function womp() {
      const t = ac.currentTime + 0.25;
      [[311, 294, 0, 0.42], [262, 220, 0.48, 1.1]].forEach(([f0, f1, dt, dur]) => {
        const o = ac.createOscillator(), lp = ac.createBiquadFilter(), g = ac.createGain(), lfo = ac.createOscillator(), lg = ac.createGain();
        o.type = "sawtooth"; o.frequency.setValueAtTime(f0, t + dt); o.frequency.linearRampToValueAtTime(f1, t + dt + dur);
        lfo.frequency.value = 5; lg.gain.value = dur > 1 ? 6 : 0; lfo.connect(lg).connect(o.frequency);
        lp.type = "lowpass"; lp.frequency.value = 900;
        g.gain.setValueAtTime(0.0001, t + dt); g.gain.exponentialRampToValueAtTime(0.2, t + dt + 0.05);
        g.gain.setValueAtTime(0.2, t + dt + dur - 0.15); g.gain.exponentialRampToValueAtTime(0.0001, t + dt + dur);
        o.connect(lp).connect(g).connect(fx); o.start(t + dt); o.stop(t + dt + dur + 0.05); lfo.start(t + dt); lfo.stop(t + dt + dur);
      });
      noiseHit(ac.currentTime + 0.02, { freq: 500, q: 0.6, dur: 0.5, vol: 0.5, type: "lowpass" });   // the poof
    }

    // small crunches while crushing
    function crunch() {
      const t = ac.currentTime + 0.005;
      for (let i = 0; i < 3; i++) noiseHit(t + Math.random() * 0.05, { freq: 1200 + Math.random() * 3000, q: 1.5, dur: 0.02 + Math.random() * 0.04, vol: 0.3 + Math.random() * 0.4 });
    }
    // paper being balled up
    function crumple() {
      const t = ac.currentTime + 0.02;
      for (let i = 0; i < 9; i++) noiseHit(t + i * 0.04 + Math.random() * 0.03, { freq: 3000 + Math.random() * 3000, q: 0.8, dur: 0.05 + Math.random() * 0.05, vol: 0.25 });
    }

    return {
      sfx(name) { if (ensure()) ({ crack, snap, sparkle, doom, breathe, buzz, womp, crunch, crumple })[name](); },
      ring(on) { if (on ? ensure() : ac) ring(on); },
      duck(on) { if (ac) duck(on); },
      start() {
        if (playing) return;
        try {
          if (!ensure()) return;
          nextTime = Math.max(nextTime, ac.currentTime + 0.15);
          if (nextTime < ac.currentTime) nextTime = ac.currentTime + 0.1;
          master.gain.cancelScheduledValues(ac.currentTime);
          master.gain.setTargetAtTime(0.55, ac.currentTime, 0.8);
          timer = setInterval(schedule, 120); schedule();
          playing = true;
        } catch (e) { /* no audio available */ }
      },
      stop() {
        if (!playing) return;
        playing = false; clearInterval(timer);
        master.gain.setTargetAtTime(0, ac.currentTime, 0.25);
        setTimeout(() => { if (!playing && ac) ac.suspend(); }, 900);
      },
      get playing() { return playing; }
    };
  })();

  const musicBtn = $(".music");
  let musicOn = store.get("fc-music") !== "off";
  let musicStarted = false;
  const syncMusicBtn = () => {
    musicBtn.setAttribute("aria-pressed", String(musicOn));
    musicBtn.querySelector("span").textContent = musicOn ? "Sound on" : "Sound off";
  };
  syncMusicBtn();
  musicBtn.addEventListener("click", () => {
    musicOn = !musicOn; store.set("fc-music", musicOn ? "on" : "off"); syncMusicBtn();
    if (musicOn && musicStarted) Music.start(); else Music.stop();
  });
  document.addEventListener("visibilitychange", () => {
    if (document.hidden) Music.stop(); else if (musicOn && musicStarted) Music.start();
  });

  /* ----- states ----- */
  let state = "closed", busy = false;
  const ease = "cubic-bezier(.2,.75,.25,1)";
  const anim = (el, kf, opts) => el.animate(kf, { fill: "forwards", ...opts }).finished;

  async function openCookie() {
    if (!musicStarted) { musicStarted = true; if (musicOn) Music.start(); }
    if (!reduced) {
      await anim(kind === "sticks" ? sticks : cookie, [
        { transform: "rotate(0)" }, { transform: "rotate(-4deg) scale(1.02)" }, { transform: "rotate(4deg) scale(1.03)" },
        { transform: "rotate(-3deg) scale(1.04)" }, { transform: "rotate(0) scale(1.05)" }
      ], { duration: 360, easing: "ease-in-out", fill: "none" });
      const r = stage.getBoundingClientRect();
      const bx = r.left + r.width * 0.49, by = r.top + r.height * (kind === "sticks" ? 0.46 : 0.62);
      if (empty) {
        burst(bx, by, true, false); burst(bx, by - 10, true, false);
        $(".poof").animate([{ opacity: 0, scale: 0.3 }, { opacity: 0.9, scale: 1, offset: 0.25 }, { opacity: 0, scale: 1.6 }], { duration: 1200, easing: "ease-out" });
        if (musicOn) { Music.sfx("crack"); Music.sfx("womp"); }
      } else {
        burst(bx, by, kind !== "sticks");
        if (musicOn) { Music.sfx(kind === "sticks" ? "snap" : "crack"); Music.sfx("sparkle"); }
      }
      flash.animate([{ opacity: 0, scale: 0.4 }, { opacity: 1, scale: 1, offset: 0.25 }, { opacity: 0, scale: 1.5 }], { duration: 650, easing: "ease-out" });
    }
    stage.classList.add("is-open");
    if (/Council demands a sacrifice/.test(fortuneEl.textContent)) {
      document.body.classList.add("ominous");
      if (musicOn) Music.sfx("doom");
    }
    const halves = kind === "sticks" ? Promise.all([
      anim(stickU, [
        { transform: "none" },
        { transform: "translate(-1%, -3%) rotate(-3deg)", offset: 0.18 },
        { transform: "translate(-5%, -52%) rotate(-9deg)" }
      ], { duration: reduced ? 1 : 900, easing: ease }),
      anim(stickL, [
        { transform: "none" },
        { transform: "translate(1%, 3%) rotate(3deg)", offset: 0.18 },
        { transform: "translate(5%, 52%) rotate(7deg)" }
      ], { duration: reduced ? 1 : 900, easing: ease })
    ]) : Promise.all([
      anim(halfL, [
        { transform: "none", opacity: 1 },
        { transform: "translate(-2%, 0) rotate(-12deg)", offset: 0.18 },
        { transform: "translate(-21%, 16%) rotate(-24deg) scale(0.7)", opacity: 1 }
      ], { duration: reduced ? 1 : 950, easing: ease }),
      anim(halfR, [
        { transform: "none", opacity: 1 },
        { transform: "translate(2%, 0) rotate(12deg)", offset: 0.18 },
        { transform: "translate(21%, 16%) rotate(24deg) scale(0.7)", opacity: 1 }
      ], { duration: reduced ? 1 : 950, easing: ease })
    ]);
    slipShown = !empty;
    const slipIn = empty ? Promise.resolve() : anim(slip, reduced ? [{ opacity: 0 }, { opacity: 1 }] : [
      { opacity: 0, transform: "translateY(18%) scale(0.06, 0.45)" },
      { opacity: 1, transform: "translateY(4%) scale(0.22, 0.7)", offset: 0.3 },
      { opacity: 1, transform: "translateY(0) scale(1.03, 1)", offset: 0.82 },
      { opacity: 1, transform: "translateY(0) scale(1, 1)" }
    ], { duration: reduced ? 250 : 900, delay: reduced ? 0 : 180, easing: ease });
    await Promise.all([halves, slipIn]);
    if (fortuneEl.textContent === CALL) { forceCall = false; callbacks = 0; setTimeout(() => ringIn("Inside the House"), 1100); }
    if (/become a missing person/i.test(fortuneEl.textContent)) forceCall = true;
    stage.setAttribute("aria-label", "Get another fortune cookie");
    hint.textContent = empty ? "Empty. Tap for another one" : "Tap for another one";
    state = "open";
  }

  let slipShown = false;
  async function newCookie() {
    await Promise.all([
      slipShown ? anim(slip, [{ opacity: 1, transform: "none" }, { opacity: 0, transform: "translateY(-30%) scale(0.92)" }], { duration: 320, easing: "ease-in" }) : null,
      ...[halfL, halfR, stickU, stickL].map((el) => anim(el, [{ opacity: 1 }, { opacity: 0 }], { duration: 280 }))
    ]);
    if (crushed) {
      await anim(paperball, [{ opacity: 1 }, { opacity: 0, transform: "translateY(20%) scale(0.8)" }], { duration: 300, easing: "ease-in" });
      paperball.getAnimations().forEach((a) => a.cancel());
      cookie.style.transform = ""; cookie.style.opacity = "";
      crushed = false;
    }
    [halfL, halfR, stickU, stickL, slip].forEach((el) => el.getAnimations().forEach((a) => a.cancel()));
    slip.style.opacity = 0;
    document.body.classList.remove("ominous");
    stage.classList.remove("is-open");
    pickKind();
    loadFortune();
    await anim(kind === "sticks" ? sticks : cookie, reduced ? [{ opacity: 0 }, { opacity: 1 }] : [
      { transform: "scale(0)", opacity: 0 }, { transform: "scale(1.08)", opacity: 1, offset: 0.7 }, { transform: "scale(1)", opacity: 1 }
    ], { duration: reduced ? 200 : 460, easing: "cubic-bezier(.3,.7,.4,1.2)", fill: "none" });
    showKind();   // restore the closed-state label and hint
    state = "closed";
  }

  /* ----- the call is coming from inside the house ----- */
  const call = $(".call"), callName = $(".call-name"), callSub = $(".call-sub"), callLabel = $(".call-label"),
        callCap = $(".call-caption"), btnDecline = $(".call-btn.decline"), btnAccept = $(".call-btn.accept"), btnEnd = $(".call-btn.end"),
        callActions = $(".call-actions");
  let callTimer = null, callTick = null, callbacks = 0;
  function ringIn(name) {
    callbacks++;
    callName.textContent = name; callLabel.textContent = "Incoming call"; callSub.textContent = "mobile"; callCap.textContent = "";
    btnDecline.hidden = btnAccept.hidden = false; btnEnd.hidden = true; callActions.classList.remove("one");
    call.hidden = false; call.classList.add("ringing");
    requestAnimationFrame(() => call.classList.add("show"));
    if (musicOn) { Music.duck(true); Music.ring(true); }
    try { navigator.vibrate && navigator.vibrate([500, 300, 500, 300, 500]); } catch (e) {}
    btnAccept.focus({ preventScroll: true });
    clearTimeout(callTimer); callTimer = setTimeout(() => hangUp("Missed call"), 18000);
  }
  function hangUp(msg) {
    clearTimeout(callTimer); clearInterval(callTick);
    Music.ring(false); call.classList.remove("ringing");
    callLabel.textContent = msg || "Call ended";
    btnDecline.hidden = btnAccept.hidden = btnEnd.hidden = true;
    setTimeout(() => {
      call.classList.remove("show");
      setTimeout(() => { call.hidden = true; if (musicOn) Music.duck(false); stage.focus({ preventScroll: true }); }, 350);
    }, msg ? 900 : 300);
  }
  btnDecline.addEventListener("click", () => {
    clearTimeout(callTimer); Music.ring(false);
    call.classList.remove("show");
    setTimeout(() => {
      call.hidden = true;
      // it calls back, once
      if (callbacks < 2) setTimeout(() => ringIn("Still Inside the House"), 1400);
      else if (musicOn) Music.duck(false);
    }, 350);
  });
  btnAccept.addEventListener("click", () => {
    clearTimeout(callTimer); Music.ring(false); call.classList.remove("ringing");
    btnDecline.hidden = btnAccept.hidden = true; btnEnd.hidden = false; callActions.classList.add("one");
    callLabel.textContent = "Connected";
    let secs = 0; callSub.textContent = "00:00";
    callTick = setInterval(() => { secs++; callSub.textContent = "00:" + String(secs).padStart(2, "0"); }, 1000);
    callCap.textContent = "*heavy breathing*";
    if (musicOn) Music.sfx("breathe");
    setTimeout(() => { if (!call.hidden) callCap.textContent = "\u201cNice fortune.\u201d"; }, 6900);
    clearTimeout(callTimer); callTimer = setTimeout(() => hangUp("Call ended"), 9000);
    btnEnd.focus({ preventScroll: true });
  });
  btnEnd.addEventListener("click", () => hangUp("Call ended"));

  /* ----- rage mode: 6 quick taps ----- */
  const rageFlash = $(".rage-flash"), page = $(".page");
  let taps = [], rageCooldown = 0;
  function rage() {
    rageCooldown = performance.now() + 4000; taps = [];
    fortuneEl.textContent = draw("rage");
    luckyEl.querySelectorAll("span").forEach((s, i, all) => (s.textContent = "0" + (i < all.length - 1 ? "," : "")));
    page.classList.remove("raging"); void page.offsetWidth; page.classList.add("raging");
    rageFlash.animate([{ opacity: 0 }, { opacity: 1, offset: 0.2 }, { opacity: 0 }], { duration: 600, easing: "ease-out" });
    if (musicOn) Music.sfx("buzz");
    try { navigator.vibrate && navigator.vibrate(300); } catch (e) {}
  }
  stage.addEventListener("pointerdown", () => {
    const now = performance.now();
    if (now < rageCooldown) return;
    taps = taps.filter((t) => now - t < 2000); taps.push(now);
    if (taps.length >= 6) rage();
  });

  /* ----- hold to crush ----- */
  const paperball = $(".paperball");
  const HOLD_DELAY = 280, CRUSH_TIME = 1700;
  let holdTimer = null, crushing = false, crushed = false, crushStart = 0, crushRaf = 0, lastCrumb = 0, lastCrunch = 0, suppressClick = false;
  stage.addEventListener("contextmenu", (e) => e.preventDefault());
  stage.addEventListener("pointerdown", () => {
    if (busy || state !== "closed" || kind !== "cookie") return;
    clearTimeout(holdTimer);
    holdTimer = setTimeout(beginCrush, HOLD_DELAY);
  });
  ["pointerup", "pointercancel", "pointerleave"].forEach((ev) => stage.addEventListener(ev, () => {
    clearTimeout(holdTimer);
    if (crushing) releaseCrush();
  }));
  function beginCrush() {
    crushing = true; busy = true; suppressClick = true;
    if (!musicStarted) { musicStarted = true; if (musicOn) Music.start(); }
    crushStart = performance.now();
    crushRaf = requestAnimationFrame(crushFrame);
  }
  function crushFrame(now) {
    const p = Math.min(1, (now - crushStart) / CRUSH_TIME), e = p * p;
    const j = 1.5 + 6 * p;
    cookie.style.transform = `translate(${(Math.random() - 0.5) * j}px, ${(Math.random() - 0.5) * j + e * 18}px) scale(${1 + 0.18 * e}, ${1 - 0.55 * e})`;
    const r = stage.getBoundingClientRect();
    if (now - lastCrumb > 90 - 50 * p) { lastCrumb = now; burst(r.left + r.width * (0.3 + Math.random() * 0.4), r.top + r.height * (0.55 + 0.15 * e), true, false, 2 + Math.round(4 * p)); }
    if (musicOn && now - lastCrunch > 170 - 90 * p) { lastCrunch = now; Music.sfx("crunch"); }
    if (p >= 1) return finishCrush();
    crushRaf = requestAnimationFrame(crushFrame);
  }
  function releaseCrush() {
    cancelAnimationFrame(crushRaf); crushing = false;
    const from = cookie.style.transform;
    cookie.style.transform = "";
    cookie.animate([{ transform: from }, { transform: "scale(1.04, 0.96)", offset: 0.6 }, { transform: "none" }], { duration: 380, easing: "cubic-bezier(.3,.7,.4,1.3)" });
    busy = false;
  }
  async function finishCrush() {
    crushing = false;
    const r = stage.getBoundingClientRect();
    burst(r.left + r.width / 2, r.top + r.height * 0.7, true, false, 45);
    if (musicOn) { Music.sfx("crack"); setTimeout(() => Music.sfx("crumple"), 350); }
    cookie.style.opacity = "0";
    crushed = true; slipShown = false; stage.classList.add("is-open");
    await anim(paperball, reduced ? [{ opacity: 0 }, { opacity: 1 }] : [
      { opacity: 0, transform: "translateY(30%) scale(0.2) rotate(-40deg)" },
      { opacity: 1, transform: "translateY(-8%) scale(1.1) rotate(8deg)", offset: 0.6 },
      { opacity: 1, transform: "none" }
    ], { duration: 650, delay: 250, easing: "cubic-bezier(.3,.7,.4,1.2)" });
    hint.textContent = "Fortune ruined. Tap for another one";
    stage.setAttribute("aria-label", "Get another fortune cookie");
    state = "open"; busy = false;
  }

  stage.addEventListener("click", async () => {
    if (suppressClick) { suppressClick = false; return; }
    if (busy) return;
    busy = true;
    try { state === "closed" ? await openCookie() : await newCookie(); }
    finally { busy = false; }
  });

  pickKind();
  loadFortune();
})();
</script>
</body>
</html>
