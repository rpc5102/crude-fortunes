<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Crude Fortunes</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Libre+Franklin:wght@400;600&family=Marcellus&display=swap">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Ma+Shan+Zheng&text=%E7%A6%8F&display=block">
<script type="module" src="/src/main.ts"></script>
</head>
<body>

<!-- Shared SVG definitions -->
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <defs>
    <linearGradient id="gGold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FCEBB0"/>
      <stop offset="0.35" stop-color="#E3B54C"/>
      <stop offset="0.7" stop-color="#A8761C"/>
      <stop offset="1" stop-color="#E3B54C"/>
    </linearGradient>
    <!-- Corner fretwork -->
    <g id="fret" fill="none" stroke="url(#gGold)" stroke-linecap="square">
      <path d="M7.5,100 V7.5 H100" stroke-width="3"/>
      <path d="M14.5,100 V14.5 H100" stroke-width="1"/>
      <path d="M22,62 V22 H62 V50 H34 V34 H50 V42 H42" stroke-width="2.6"/>
      <path d="M22,74 V82 M74,22 H82" stroke-width="2.6"/>
    </g>
  </defs>
</svg>

<div class="clouds" aria-hidden="true"></div>
<div class="doom" aria-hidden="true"></div>

<div class="frame" aria-hidden="true">
  <svg class="corner tl" viewBox="0 0 100 100"><use href="#fret"/></svg>
  <svg class="corner tr" viewBox="0 0 100 100"><use href="#fret"/></svg>
  <svg class="corner bl" viewBox="0 0 100 100"><use href="#fret"/></svg>
  <svg class="corner br" viewBox="0 0 100 100"><use href="#fret"/></svg>
</div>

<canvas class="fx" aria-hidden="true"></canvas>
<div class="rage-flash" aria-hidden="true"></div>

<div class="call" role="dialog" aria-modal="true" aria-label="Incoming call" hidden>
  <div class="call-who">
    <p class="call-label">Incoming call</p>
    <p class="call-name">Inside the House</p>
    <p class="call-sub">mobile</p>
  </div>
  <p class="call-caption" aria-live="polite"></p>
  <div class="call-actions">
    <button class="call-btn decline" type="button"><i><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6.6 10.8c1.4 2.8 3.8 5.1 6.6 6.6l2.2-2.2c.3-.3.7-.4 1-.2 1.1.4 2.3.6 3.6.6.6 0 1 .4 1 1V20c0 .6-.4 1-1 1C10.6 21 3 13.4 3 4c0-.6.4-1 1-1h3.5c.6 0 1 .4 1 1 0 1.3.2 2.5.6 3.6.1.3 0 .7-.2 1z"/></svg></i>Decline</button>
    <button class="call-btn end" type="button" hidden><i><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6.6 10.8c1.4 2.8 3.8 5.1 6.6 6.6l2.2-2.2c.3-.3.7-.4 1-.2 1.1.4 2.3.6 3.6.6.6 0 1 .4 1 1V20c0 .6-.4 1-1 1C10.6 21 3 13.4 3 4c0-.6.4-1 1-1h3.5c.6 0 1 .4 1 1 0 1.3.2 2.5.6 3.6.1.3 0 .7-.2 1z"/></svg></i>End</button>
    <button class="call-btn accept" type="button"><i><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6.6 10.8c1.4 2.8 3.8 5.1 6.6 6.6l2.2-2.2c.3-.3.7-.4 1-.2 1.1.4 2.3.6 3.6.6.6 0 1 .4 1 1V20c0 .6-.4 1-1 1C10.6 21 3 13.4 3 4c0-.6.4-1 1-1h3.5c.6 0 1 .4 1 1 0 1.3.2 2.5.6 3.6.1.3 0 .7-.2 1z"/></svg></i>Accept</button>
  </div>
</div>

<div class="page">
  <header>
    <div class="seal" aria-hidden="true"><span>福</span></div>
    <p class="wordmark">Crude Fortunes</p>
  </header>

  <main>
    <button class="stage" type="button" aria-label="Open the fortune cookie">
      <div class="glow"></div>
      <div class="bob">
        <div class="cookie">
          <!-- Side view of a folded cookie: round outline with the classic V fold.
               It splits along the fold line, from the V's point down to the bottom. -->
          <!-- One picture, clipped into two halves along a jagged break line -->
          <div class="flip">
            <img class="half left" alt="" src="/src/assets/cookie.webp">
            <img class="half right" alt="" src="/src/assets/cookie.webp">
          </div>
        </div>
        <!-- 1 in 10: chopsticks instead of a cookie -->
        <div class="sticks" hidden>
          <img class="stick upper" alt="" src="/src/assets/chopstick-upper.webp">
          <img class="stick lower" alt="" src="/src/assets/chopstick-lower.webp">
        </div>
      </div>
      <div class="flash"></div>
      <div class="poof"></div>
      <svg class="paperball" viewBox="0 0 100 90" aria-hidden="true">
        <polygon points="18,40 27,17 46,9 65,13 81,27 87,47 78,67 60,79 37,81 19,68 11,52" fill="#F7F1E3"/>
        <polygon points="27,17 46,9 50,30 34,36" fill="#E8DFCB"/>
        <polygon points="65,13 81,27 70,40 56,30" fill="#EFE7D5"/>
        <polygon points="19,68 11,52 30,50 38,62" fill="#E3D9C3"/>
        <polygon points="60,79 78,67 66,56 52,64" fill="#E8DFCB"/>
        <polygon points="50,30 56,30 70,40 66,56 52,64 38,62 30,50 34,36" fill="#FBF7EC"/>
        <g fill="none" stroke="#9C8566" stroke-opacity="0.45" stroke-width="1" stroke-linejoin="round">
          <path d="M27,17 L34,36 L18,40 M46,9 L50,30 L65,13 M81,27 L70,40 L87,47 M78,67 L66,56 L60,79 M37,81 L38,62 L19,68 M11,52 L30,50 M50,30 L34,36 L30,50 L38,62 L52,64 L66,56 L70,40 L56,30 Z"/>
        </g>
        <g stroke="#BF2430" stroke-opacity="0.55" stroke-width="1.6" stroke-linecap="round">
          <path d="M40,44 l9,-2 M42,49 l12,-3 M45,55 l7,-1"/>
          <path d="M60,46 l5,1" stroke-opacity="0.35"/>
          <path d="M24,56 l6,-1" stroke-opacity="0.3"/>
        </g>
        <polygon points="18,40 27,17 46,9 65,13 81,27 87,47 78,67 60,79 37,81 19,68 11,52" fill="none" stroke="#A89474" stroke-opacity="0.5" stroke-width="1.2" stroke-linejoin="round"/>
      </svg>
      <div class="slip-pos">
        <div class="slip" aria-live="polite">
          <div class="slip-paper">
            <p class="fortune-text"></p>
            <p class="lucky"><b>Lucky Numbers</b></p>
          </div>
        </div>
      </div>
    </button>
    <p class="hint">Tap the cookie</p>
  </main>

  <div class="controls">
    <fieldset>
      <legend>Fortunes</legend>
      <div class="seg">
        <input type="radio" name="mode" id="mode-real" value="real"><label for="mode-real">Real</label>
        <input type="radio" name="mode" id="mode-crude" value="crude" checked><label for="mode-crude">Crude</label>
      </div>
    </fieldset>
    <button class="music" type="button" aria-pressed="true">&#9835; <span>Sound on</span></button>
  </div>
</div>

</body>
</html>
